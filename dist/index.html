<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Next Set — less typing, more lifting</title><style>*{box-sizing:border-box}body{margin:0;background:#101411;color:#edf0e8;font:16px system-ui}main{max-width:650px;margin:auto;padding:32px 20px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:42px;letter-spacing:-2px;margin:32px 0 6px}h2{font-size:20px}p,small{color:#a8b1a8}button,input{font:inherit;border:1px solid #39443a;border-radius:12px;padding:13px;background:#232c24;color:inherit}button{cursor:pointer}button:hover{border-color:#c4ee89}button:focus-visible,input:focus-visible{outline:2px solid #c4ee89}nav{display:flex;gap:8px;margin:28px 0}nav button{flex:1}.primary,.done{background:#c4ee89;color:#17200d}.card{border:1px solid #344035;background:#19201a;border-radius:20px;padding:20px;margin:16px 0}.row{display:grid;grid-template-columns:32px 1fr 1fr 55px;gap:10px;align-items:center;margin:10px 0}input{width:100%;min-width:0}label{font-size:12px;color:#a8b1a8}.wide{width:100%;margin-top:12px}footer{margin-top:32px;font-size:12px;color:#a8b1a8}.muted{opacity:.65}a{color:#c4ee89}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}</style><main><header><b>◒ NEXT SET</b><small>YOUR PERSONAL TRAINING LOG</small></header><h1>Show up. Get stronger.</h1><p>Your last workout, ready to go. Change only what’s different.</p><nav><button onclick="tab='workout';render()">Workout</button><button onclick="tab='history';render()">History</button><button onclick="tab='progress';render()">Progress</button></nav><div id="app"></div><footer>Saved on this device’s browser. Export a backup to keep your history safe.<br><button class="wide" onclick="backup()">Export my data ↓</button></footer></main><script>
const key='next-set-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=state||{exercises:[],history:[],weights:[]};let tab='workout';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Storage is full or unavailable. Export your data before closing.')}}function render(){if(tab==='workout'){app.innerHTML=`<div class="top"><h2>Today’s session</h2><small>${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></div>${state.exercises.length?'':'<div class="card"><h2>Make it yours.</h2><p>Add your first exercise below. We’ll remember your sets for next time.</p></div>'}${state.exercises.map((e,i)=>`<section class="card"><div class="top"><h2>${esc(e.name)}</h2><button aria-label="Remove ${esc(e.name)}" onclick="removeExercise(${i})">×</button></div><div class="row"><label>SET</label><label>WEIGHT (LB)</label><label>REPS</label><label>DONE</label></div>${e.sets.map((s,j)=>`<div class="row"><small>${j+1}</small><input aria-label="${esc(e.name)} set ${j+1} weight" type="number" min="0" step="0.5" value="${s.weight}" onchange="change(${i},${j},'weight',this)"><input aria-label="${esc(e.name)} set ${j+1} reps" type="number" min="1" step="1" value="${s.reps}" onchange="change(${i},${j},'reps',this)"><button aria-label="Complete set ${j+1}" aria-pressed="${s.done}" class="${s.done?'done':''}" onclick="state.exercises[${i}].sets[${j}].done=!state.exercises[${i}].sets[${j}].done;save();render()">✓</button></div>`).join('')}<button class="wide" onclick="addSet(${i})">+ Add set</button></section>`).join('')}<form onsubmit="event.preventDefault();addExercise(this)"><div class="top"><input name="exercise" aria-label="Exercise name" placeholder="e.g. Bench press" maxlength="80" required><button>Add</button></div></form>${state.exercises.length?'<button class="primary wide" onclick="finish()">Finish workout →</button>':''}`;}else if(tab==='history'){app.innerHTML='<h2>Your sessions</h2>'+ (state.history.slice().reverse().map(h=>`<div class="card"><h2>${new Date(h.date).toLocaleDateString()}</h2>${h.exercises.map(e=>`<p><b>${esc(e.name)}</b><br>${e.sets.map(s=>`${s.weight} lb × ${s.reps}`).join(' · ')}</p>`).join('')}</div>`).join('')||'<p>Your completed workouts will appear here.</p>')}else{app.innerHTML=`<h2>A little stronger, every week.</h2><div class="card"><h2>${state.history.length} workouts completed</h2><p>Each session is a step forward.</p></div><form class="card" onsubmit="event.preventDefault();logWeight(this)"><h2>Body weight · optional</h2><div class="top"><input name="weight" aria-label="Body weight in pounds" placeholder="Weight in lb" type="number" min="1" max="1500" step="0.1" required><button>Save</button></div></form>${state.weights.slice().reverse().map(w=>`<p>${new Date(w.date).toLocaleDateString()} <b style="float:right">${w.weight} lb</b></p>`).join('')}<h2>Best logged weights</h2>${bests()}`}}
function change(i,j,k,input){const v=Number(input.value);if(!input.value||!Number.isFinite(v)||v<(k==='reps'?1:0)||(k==='reps'&&!Number.isInteger(v))){input.value=state.exercises[i].sets[j][k];return}state.exercises[i].sets[j][k]=v;save()}
function addExercise(form){const name=form.exercise.value.trim();if(!name)return;state.exercises.push({name,sets:[1,2,3].map(()=>({weight:0,reps:8,done:false}))});save();render()}function addSet(i){const s=state.exercises[i].sets; s.push({...s[s.length-1],done:false});save();render()}function removeExercise(i){if(confirm('Remove this exercise from your routine? Saved history stays.')){state.exercises.splice(i,1);save();render()}}function finish(){const exercises=state.exercises.map(e=>({name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({...s}))})).filter(e=>e.sets.length);if(!exercises.length){alert('Check off at least one completed set first.');return}state.history.push({date:new Date().toISOString(),exercises});state.exercises.forEach(e=>e.sets.forEach(s=>s.done=false));save();tab='history';render()}function logWeight(f){state.weights.push({date:new Date().toISOString(),weight:Number(f.weight.value)});save();render()}function bests(){const b={};state.history.forEach(h=>h.exercises.forEach(e=>e.sets.forEach(s=>b[e.name]=Math.max(b[e.name]||0,s.weight))));return Object.entries(b).map(([n,w])=>`<p>${esc(n)}<b style="float:right">${w} lb</b></p>`).join('')||'<p>Complete a workout to see your numbers.</p>'}function backup(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='next-set-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></html>
